# ===================================
# 量化分析平台 - Docker Compose 配置
# ===================================

version: '3.8'

services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: quant-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-quant_root_password}
      MYSQL_DATABASE: ${DB_NAME:-quant_analysis}
      MYSQL_USER: ${DB_USER:-quant_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-quant_password}
    volumes:
      # 数据持久化
      - mysql_data:/var/lib/mysql
      # 初始化脚本
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3306:3306"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quant-network

  # Node.js 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant-backend
    ports:
      - "3000:3000"
    environment:
      # 服务配置
      - NODE_ENV=production
      - PORT=3000
      # 数据库配置
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER:-quant_user}
      - DB_PASSWORD=${DB_PASSWORD:-quant_password}
      - DB_NAME=${DB_NAME:-quant_analysis}
      # JWT配置
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quant-network
    volumes:
      # 日志目录
      - ./logs:/app/logs

volumes:
  mysql_data:
    driver: local

networks:
  quant-network:
    driver: bridge
